<html lang="en">

<title>Design Challenge Generator</title>
<style>
  :root {
    --red: #A6192E;
    --ink: #000000;
    --paper: #FFFFFF;
    --muted: #555555;
    --line: #D9D9D9;
    --soft: #F6EEEF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --red: #E0566B; --ink: #FFFFFF; --paper: #141414; --muted: #BBBBBB; --line: #3A3A3A; --soft: #2A1B1E;
    }
  }
  :root[data-theme="dark"] {
    --red: #E0566B; --ink: #FFFFFF; --paper: #141414; --muted: #BBBBBB; --line: #3A3A3A; --soft: #2A1B1E;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Arial, "Proxima Nova", Helvetica, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 24px; }

  /* The ruler: the one memorable thing */
  .ruler {
    height: 34px; border: 2px solid var(--ink); border-bottom: none;
    background:
      repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 40px) 0 0 / 100% 22px no-repeat,
      repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 20px) 0 0 / 100% 14px no-repeat,
      repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 10px) 0 0 / 100% 8px no-repeat,
      var(--paper);
    position: relative;
  }
  .card { border: 2px solid var(--ink); padding: 22px 22px 20px; background: var(--paper); }
  .mode {
    display: inline-block; background: var(--red); color: #FFFFFF;
    font-weight: bold; font-size: 14px; padding: 4px 10px; margin-bottom: 14px;
  }
  .challenge { font-size: clamp(22px, 4.6vw, 30px); font-weight: bold; line-height: 1.2; margin: 0 0 18px; }
  .challenge .slot { color: var(--red); }
  .specs { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; }
  .specs li { border-left: 4px solid var(--red); padding: 4px 0 4px 12px; }
  .specs b { display: block; font-size: 13px; color: var(--muted); font-weight: bold; }
  .show {
    background: var(--soft); padding: 12px 14px; font-size: 15px; margin-bottom: 18px;
  }
  .show strong { color: var(--red); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: bold 16px Arial, Helvetica, sans-serif; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
    padding: 10px 18px;
  }
  button.alt { background: transparent; color: var(--ink); }
  button:hover { background: var(--red); border-color: var(--red); color: #FFFFFF; }
